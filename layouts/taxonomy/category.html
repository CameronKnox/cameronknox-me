{{ define "main" }}
    <h1>{{ .Title }} Posts</h1>
    <p class="post-meta">{{ len .Pages }} {{ if eq (len .Pages) 1 }}post{{ else }}posts{{ end }} in this category</p>

    <div class="post-list">
        {{ range .Pages }}
        {{ partial "post-item.html" (dict "page" . "level" "h2" "current" $.RelPermalink) }}
        {{ end }}
    </div>
{{ end }}
