{{- $cls := . | default "" -}}
<span class="analog-clock {{ $cls }}">
    <svg viewBox="0 0 60 60" class="clock-svg" role="img" aria-label="Analog clock showing current time">
        <circle class="clock-face" cx="30" cy="30" r="28"/>
        <g class="clock-ticks">
            {{- range seq 0 11 }}
            {{- $major := eq (mod . 3) 0 }}
            <line class="{{ if $major }}tick-major{{ else }}tick-minor{{ end }}" x1="30" y1="5" x2="30" y2="{{ if $major }}10{{ else }}8{{ end }}" transform="rotate({{ mul . 30 }} 30 30)"/>
            {{- end }}
        </g>
        <line class="hand hand-hour" x1="30" y1="32" x2="30" y2="17"/>
        <line class="hand hand-minute" x1="30" y1="33" x2="30" y2="10"/>
        <line class="hand hand-second" x1="30" y1="36" x2="30" y2="8"/>
        <circle class="clock-pin" cx="30" cy="30" r="2.2"/>
        <circle class="clock-pin-center" cx="30" cy="30" r="1"/>
    </svg>
</span>
