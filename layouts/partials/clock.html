{{- $cls := . | default "" -}}
<span class="analog-clock {{ $cls }}">
    <svg viewBox="0 0 60 60" class="clock-svg" role="img" aria-label="Analog clock showing current time">
        <circle cx="30" cy="30" r="28" fill="none" stroke="var(--color-border-strong)" stroke-width="2"/>
        <g class="hour-markers">
            <line x1="30" y1="4" x2="30" y2="8" stroke="var(--color-text)" stroke-width="2" transform="rotate(0 30 30)"/>
            <line x1="30" y1="4" x2="30" y2="8" stroke="var(--color-text)" stroke-width="2" transform="rotate(30 30 30)"/>
            <line x1="30" y1="4" x2="30" y2="8" stroke="var(--color-text)" stroke-width="2" transform="rotate(60 30 30)"/>
            <line x1="30" y1="4" x2="30" y2="8" stroke="var(--color-text)" stroke-width="2" transform="rotate(90 30 30)"/>
            <line x1="30" y1="4" x2="30" y2="8" stroke="var(--color-text)" stroke-width="2" transform="rotate(120 30 30)"/>
            <line x1="30" y1="4" x2="30" y2="8" stroke="var(--color-text)" stroke-width="2" transform="rotate(150 30 30)"/>
            <line x1="30" y1="4" x2="30" y2="8" stroke="var(--color-text)" stroke-width="2" transform="rotate(180 30 30)"/>
            <line x1="30" y1="4" x2="30" y2="8" stroke="var(--color-text)" stroke-width="2" transform="rotate(210 30 30)"/>
            <line x1="30" y1="4" x2="30" y2="8" stroke="var(--color-text)" stroke-width="2" transform="rotate(240 30 30)"/>
            <line x1="30" y1="4" x2="30" y2="8" stroke="var(--color-text)" stroke-width="2" transform="rotate(270 30 30)"/>
            <line x1="30" y1="4" x2="30" y2="8" stroke="var(--color-text)" stroke-width="2" transform="rotate(300 30 30)"/>
            <line x1="30" y1="4" x2="30" y2="8" stroke="var(--color-text)" stroke-width="2" transform="rotate(330 30 30)"/>
        </g>
        <line class="hand hand-hour" x1="30" y1="30" x2="30" y2="18" stroke="var(--color-text)" stroke-width="3" stroke-linecap="round"/>
        <line class="hand hand-minute" x1="30" y1="30" x2="30" y2="12" stroke="var(--color-text)" stroke-width="2" stroke-linecap="round"/>
        <line class="hand hand-second" x1="30" y1="30" x2="30" y2="10" stroke="var(--color-clock-second)" stroke-width="1" stroke-linecap="round"/>
        <circle cx="30" cy="30" r="2" fill="var(--color-text)"/>
    </svg>
</span>
