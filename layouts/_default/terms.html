{{ define "main" }}
    <h1>{{ .Title }}</h1>
    <p class="post-meta">All {{ len .Data.Terms }} {{ lower .Title }} on this blog, most used first</p>

    <div class="terms-list">
        {{ range .Data.Terms.ByCount }}
        <a href="{{ .Page.RelPermalink }}" class="tag term-item">
            {{ .Page.LinkTitle | lower }}<span class="term-count">{{ .Count }}</span>
        </a>
        {{ end }}
    </div>
{{ end }}
