baseURL = 'https://cameronknox.io/'
locale = 'en-US'
title = "Cameron's Blog"
copyright = "Cameron Knox"

buildFuture = false
disableKinds = ["rss"]
enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    style = "github"
    codeFences = true
    guessSyntax = true

[params]
  description = "Cameron Knox's blog: software, AI, travel, gear, and whatever else I'm into lately."
  avatar = "https://avatars.githubusercontent.com/u/19205959?v=4&s=400"

